name: Vérifier la bibliothèque

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Index et README à jour, fichiers complets
        run: node tools/build-index.mjs --check
